<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="optcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f181c"/>
      <stop offset="100%" stop-color="#090708"/>
    </linearGradient>
    <linearGradient id="optcLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4f461"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="optcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4ade80" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#optcBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" stroke="rgba(74,222,128,0.3)" stroke-width="1.5"/>

  <!-- Shield Arc -->
  <path d="M16 16 H 48 V 32 C 48 43, 32 49, 32 49 C 32 49, 16 43, 16 32 Z" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Infinite Harvest Loop (Two Intertwined Leaves) -->
  <g filter="url(#optcGlow)">
    <path d="M32 20 C 39 20, 43 25, 41 31 C 39 37, 33 37, 32 37 C 32 31, 35 26, 32 20 Z" fill="url(#optcLime)"/>
    <path d="M32 40 C 25 40, 21 35, 23 29 C 25 23, 31 23, 32 23 C 32 29, 29 34, 32 40 Z" fill="#22c55e"/>
    <circle cx="32" cy="30" r="3" fill="#ffffff"/>
  </g>
</svg>