<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="optbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f181c"/>
      <stop offset="100%" stop-color="#090708"/>
    </linearGradient>
    <linearGradient id="optbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="optbLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4f461"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="optbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#ca8a04" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#optbBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" stroke="rgba(234,179,8,0.3)" stroke-width="1.5"/>

  <!-- Geometric 'A' frame -->
  <path d="M18 48 L 32 14 L 46 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 36 L 40 36" stroke="rgba(255,255,255,0.4)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Central Golden Ear of Corn / Grain Spire -->
  <g filter="url(#optbGlow)">
    <!-- Central stem -->
    <path d="M32 44 V 18" stroke="url(#optbLime)" stroke-width="2" stroke-linecap="round"/>
    <!-- Grain kernels (paired tilted ovals) -->
    <ellipse cx="29" cy="23" rx="3.5" ry="2" transform="rotate(-30 29 23)" fill="url(#optbGold)"/>
    <ellipse cx="35" cy="23" rx="3.5" ry="2" transform="rotate(30 35 23)" fill="url(#optbGold)"/>
    <ellipse cx="28.5" cy="29" rx="3.8" ry="2.2" transform="rotate(-28 28.5 29)" fill="url(#optbGold)"/>
    <ellipse cx="35.5" cy="29" rx="3.8" ry="2.2" transform="rotate(28 35.5 29)" fill="url(#optbGold)"/>
    <ellipse cx="28" cy="35" rx="4" ry="2.2" transform="rotate(-25 28 35)" fill="url(#optbGold)"/>
    <ellipse cx="36" cy="35" rx="4" ry="2.2" transform="rotate(25 36 35)" fill="url(#optbGold)"/>
    <!-- Top sprout tip -->
    <path d="M32 18 C 30 14, 32 11, 32 11 C 32 11, 34 14, 32 18 Z" fill="#b4f461"/>
  </g>
</svg>