<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="limeGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#65a30d"/>
    </linearGradient>
    <linearGradient id="amberGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (48x48) -->
  <g transform="translate(4, 4)">
    <rect width="48" height="48" rx="15" fill="url(#bgGradLight)"/>
    <rect width="48" height="48" rx="15" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Field Furrows -->
    <path d="M12 37 C 17 32, 21 28, 24 26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M36 37 C 31 32, 27 28, 24 26" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Sun / Seed -->
    <circle cx="34" cy="14" r="3.5" fill="url(#amberGradLight)"/>

    <!-- Sprout & Leaf -->
    <g>
      <path d="M24 26 C 24 17, 30 12, 33 11 C 34 15, 30 21, 24 26 Z" fill="url(#limeGradLight)"/>
      <path d="M24 27 C 19 24, 13 19, 15 12 C 20 11, 23 17, 24 27 Z" fill="#15803d"/>
      <path d="M24 35 V 20" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 20 C 22.5 15, 24 10, 24 9.5 C 25 10, 26.5 15, 24 20 Z" fill="#15803d"/>
    </g>
  </g>

  <!-- Typography: AgroGest -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" fill="#0f172a" letter-spacing="-0.5">Agro<tspan fill="#15803d">Gest</tspan></text>
  
  <!-- Subtitle Tag -->
  <text x="65" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="8.5" fill="#64748b" letter-spacing="1.8">NAMPULA • GESTÃO AGRÍCOLA</text>
</svg>