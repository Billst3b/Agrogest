<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241d20"/>
      <stop offset="50%" stop-color="#181316"/>
      <stop offset="100%" stop-color="#0e0b0d"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#b4f461"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(180,244,97,0.3)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b4f461" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base (Floating Emblem) -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="18" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Field Furrow Lines (Perspectiva Agrícola de Nampula) -->
  <path d="M16 48 C 22 42, 28 36, 32 34" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 48 C 42 42, 36 36, 32 34" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round"/>
  <path d="M22 50 C 26 45, 30 40, 32 37" stroke="rgba(74,222,128,0.35)" stroke-width="2" stroke-linecap="round"/>
  <path d="M42 50 C 38 45, 34 40, 32 37" stroke="rgba(74,222,128,0.35)" stroke-width="2" stroke-linecap="round"/>

  <!-- Golden Sun / Seed Energy Dot -->
  <circle cx="44" cy="19" r="4.5" fill="url(#amberGrad)"/>
  <circle cx="44" cy="19" r="7" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>

  <!-- Central Growing Sprout & Leaf (Stylized 'A' + Folha) -->
  <g filter="url(#glow)">
    <!-- Folha Direita Superior -->
    <path d="M32 34 C 32 23, 40 16, 43 15 C 44 20, 39 28, 32 34 Z" fill="url(#limeGrad)"/>
    <!-- Folha Esquerda Principal (Arqueada) -->
    <path d="M32 36 C 26 33, 17 26, 20 17 C 26 16, 30 24, 32 36 Z" fill="#22c55e"/>
    <path d="M32 36 C 28 32, 20 25, 22 18 C 26 17, 30 24, 32 36 Z" fill="url(#limeGrad)" opacity="0.9"/>
    <!-- Tronco / Talo Central Dinâmico -->
    <path d="M32 46 V 26" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Broto Central Luminous Leaf -->
    <path d="M32 26 C 30 20, 32 14, 32 13 C 33 14, 35 20, 32 26 Z" fill="#ffffff"/>
  </g>
</svg>
