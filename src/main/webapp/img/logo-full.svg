<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <linearGradient id="bgGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241d20"/>
      <stop offset="50%" stop-color="#181316"/>
      <stop offset="100%" stop-color="#0e0b0d"/>
    </linearGradient>
    <linearGradient id="limeGradFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="60%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#b4f461"/>
    </linearGradient>
    <linearGradient id="amberGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="borderGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(180,244,97,0.3)"/>
    </linearGradient>
    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#b4f461" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (48x48) -->
  <g transform="translate(4, 4)">
    <rect width="48" height="48" rx="15" fill="url(#bgGradFull)"/>
    <rect width="48" height="48" rx="15" stroke="url(#borderGradFull)" stroke-width="1.2"/>

    <!-- Field Furrows -->
    <path d="M12 37 C 17 32, 21 28, 24 26" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M36 37 C 31 32, 27 28, 24 26" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Sun / Seed -->
    <circle cx="34" cy="14" r="3.5" fill="url(#amberGradFull)"/>
    <circle cx="34" cy="14" r="5.5" stroke="rgba(245,158,11,0.28)" stroke-width="1"/>

    <!-- Sprout & Leaf (A + Leaf) -->
    <g filter="url(#glowFull)">
      <path d="M24 26 C 24 17, 30 12, 33 11 C 34 15, 30 21, 24 26 Z" fill="url(#limeGradFull)"/>
      <path d="M24 27 C 19 24, 13 19, 15 12 C 20 11, 23 17, 24 27 Z" fill="#22c55e"/>
      <path d="M24 27 C 21 24, 15 20, 17 14 C 20 13, 23 18, 24 27 Z" fill="url(#limeGradFull)" opacity="0.9"/>
      <path d="M24 35 V 20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      <path d="M24 20 C 22.5 15, 24 10, 24 9.5 C 25 10, 26.5 15, 24 20 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Typography: AgroGest -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="-0.5">Agro<tspan fill="#b4f461">Gest</tspan></text>
  
  <!-- Subtitle Tag -->
  <text x="65" y="45" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="8.5" fill="#a1979b" letter-spacing="1.8">NAMPULA • GESTÃO AGRÍCOLA</text>
</svg>
